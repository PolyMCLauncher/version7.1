<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>-</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; }
        
        #tela-preta {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 999;
            cursor: pointer;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <div id="tela-preta"></div>

    <video id="v" src="jeff.mp4" loop playsinline preload="auto"></video>

    <script>
        const video = document.getElementById('v');
        const telaPreta = document.getElementById('tela-preta');

        function dispararVideo() {
            video.muted = false;
            video.play().then(() => {
                telaPreta.style.display = 'none';
            }).catch(err => {
                console.log("Erro ao reproduzir:", err);
            });
        }

        // Qualquer toque ou clique na tela destrava o processo imediatamente
        window.addEventListener('click', dispararVideo, { once: true });
        window.addEventListener('touchstart', dispararVideo, { once: true });
    </script>

</body>
</html>
