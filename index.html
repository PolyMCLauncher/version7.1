<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        /* Começa invisível (opacity: 0) para esconder o primeiro frame */
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; opacity: 0; transition: opacity 0.2s ease; }
    </style>
</head>
<body>
    <video id="v" src="jeff.mp4" autoplay loop playsinline></video>
    <script>
        const v = document.getElementById('v');
        v.muted = false;

        // Função para mostrar o vídeo assim que ele realmente começar a rodar
        v.addEventListener('play', () => {
            v.style.opacity = 1;
        });

        v.play().catch(() => {
            document.body.addEventListener('click', () => {
                v.muted = false; 
                v.play(); 
            }, { once: true });
        });
    </script>
</body>
</html>
