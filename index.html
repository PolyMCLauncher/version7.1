<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; }
    </style>
</head>
<body>
    <video id="v" src="jeff.mp4" autoplay loop playsinline></video>
    <script>
        const v = document.getElementById('v');
        v.muted = false;
        v.play().catch(() => {
            document.body.addEventListener('click', () => { v.muted = false; v.play(); }, { once: true });
        });
    </script>
</body>
</html>
